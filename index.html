<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Laser Shooter Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Note: OrbitControls and BufferGeometryUtils are not included by default in this new setup.
         We will add them if/when needed for the new game (e.g., OrbitControls for editor debug). -->
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; } /* Ensure canvas takes up full space if not handled by JS */
    </style>
</head>
<body>
    <!-- Content will be primarily managed by game.js through Three.js -->
    <script type="module" src="game.js"></script> <!-- Use type="module" for modern JS features -->
</body>
</html>
